<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="wrap hero">
    <h1 id="name"></h1>
    <p id="tagline"></p>
    <nav id="links" aria-label="Contact links"></nav>
  </header>

  <main class="wrap">
    <section aria-labelledby="projects-h">
      <h2 id="projects-h">Projects</h2>
      <p id="status" class="muted">Loading projects from GitHub…</p>
      <div id="repos"></div>
    </section>

    <section id="upcoming-section" aria-labelledby="upcoming-h">
      <h2 id="upcoming-h">Coming soon</h2>
      <div id="upcoming" class="grid"></div>
    </section>
  </main>

  <footer class="wrap muted">© <span id="year"></span> <span id="footer-name"></span></footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
