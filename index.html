<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="wrap hero">
    <p class="hello">Hi, I'm</p>
    <h1 id="name"></h1>
    <p id="tagline" class="tagline"></p>
    <div class="cta">
      <a href="#projects" class="btn primary">Try my projects ↓</a>
      <span id="links"></span>
    </div>
    <dl id="stats" class="stats"></dl>
  </header>

  <main class="wrap">
    <section id="projects" aria-labelledby="projects-h">
      <h2 id="projects-h">Projects</h2>
      <div id="filters" class="filters" role="group" aria-label="Filter by category"></div>
      <p id="status" class="muted">Loading projects…</p>
      <div id="repos"></div>
    </section>

    <section id="upcoming-section" aria-labelledby="upcoming-h">
      <h2 id="upcoming-h">Coming soon</h2>
      <div id="upcoming" class="grid"></div>
    </section>
  </main>

  <footer class="wrap muted">© <span id="year"></span> <span id="footer-name"></span></footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
